name: CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:

env:
  DJANGO_SETTINGS_MODULE: django_ecommers.config.settings
  SECRET_KEY: ci-dummy-secret-key
  DJANGO_ENV: production
  DB_NAME: mydb
  DB_USER: myuser
  DB_PASSWORD: mypass
  DB_HOST: localhost
  DB_PORT: "5432"

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      psotgres:
        image: postgres:16
        env:
          POSTGRES_DB: mydb
          POSTGRES_USER: myuser
          POSTGRES_PASSWORD: mypass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U myuser -d mydb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install uv
          uv sync --dev

      - name: format
        run: uv run ruff format .
      - name: Lint
        run: uv run ruff check .
      - name: Type checking
        run: uv run mypy . --show-traceback
      - name: Tests
        run: uv run pytest
      - name: Docker build
        run: docker build -t django_ecommers .
